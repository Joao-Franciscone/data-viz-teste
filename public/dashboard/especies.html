<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Especies - Dashboard</title>
  <link rel="stylesheet" href="/css/especies.css">
 </head>
<body>
  <div class="container">
    <h1>Cadastro de Espécies</h1>
    <form id="formEspecie">
      <label>Nome: <input type="text" id="nome" /></label>
      <label>Aquário: <select id="selectAquario"></select></label>
      <label>Tipo de água preferida: <select id="tipoAgua"><option value="doce">Doce</option><option value="salgada">Salgada</option></select></label>
      <button type="submit">Cadastrar</button>
    </form>

    <h2>Filtros</h2>
    <div id="filtros">
      <select id="filtroTipoAgua"><option value="">Todos</option><option value="doce">Doce</option><option value="salgada">Salgada</option></select>
      <input type="number" id="filtroTamanho" placeholder="tamanho" />
      <button id="btnFiltrar">Filtrar</button>
    </div>

    <h2>Lista de Espécies</h2>
    <table id="tabelaEspecies"><thead><tr><th>ID</th><th>Nome</th><th>Aquário</th><th>Tipo Água</th><th>Tamanho</th></tr></thead><tbody></tbody></table>
  </div>
  <script src="/js/especies.js"></script>
</body>
</html>
